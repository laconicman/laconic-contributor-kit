# ContributorKit — one round trip per candidate thread.
#
# Returns issue comments, review bodies and review threads together. The review
# BODY is the piece an inline-only fetch silently misses; TASK §4 records that
# miss happening three times.
#
# Every comment kind carries `updatedAt`, `lastEditedAt`, `editor` and
# `viewerDidAuthor`. That is not decoration: REST's `pull-request-review` schema
# has `submitted_at` and NOTHING else — no `created_at`, no `updated_at` — so
# GraphQL is the only API that can tell you a REVIEW BODY was edited. The channel
# with no reply mechanism is also the channel REST cannot diff.
#
# `reviews()` no longer filters by `author:`, and $login is gone with it. The
# audit needs every reviewer's bodies, not only ours, and `viewerDidAuthor`
# already says which are ours without a login round-trip. Capability A filters
# client-side. One query now serves both directions.
#
# The subject's own `body` is fetched too: for an issue it IS the ask, and a pull
# request's description can carry one. It rides the issue-comments channel as a
# synthesized item — GitHub's own timeline treats the body as the thread's first
# entry, and the obligation machinery then works on it unchanged.
#
# Validated 2026-09-05 against octokit/graphql-schema@main with graphql-js;
# re-validated 2026-09-07 after the edit-tracking fields were added.
# Note `issueState`/`pullRequestState`: Issue.state and PullRequest.state return
# different enums, so the same response key across the two fragments is a
# validation error. The aliases are load-bearing, not cosmetic.
query ThreadDetail(
  $owner: String!
  $name: String!
  $number: Int!
  $commentCursor: String
  $reviewCursor: String
  $threadCursor: String
) {
  repository(owner: $owner, name: $name) {
    issueOrPullRequest(number: $number) {
      __typename
      ... on Issue {
        number
        title
        url
        issueState: state
        closed
        closedAt
        body author { login } viewerDidAuthor createdAt updatedAt lastEditedAt
        comments(first: 100, after: $commentCursor) {
          pageInfo { hasNextPage endCursor }
          nodes { body url createdAt updatedAt lastEditedAt editor { login } viewerDidAuthor author { login } }
        }
      }
      ... on PullRequest {
        number
        title
        url
        pullRequestState: state
        closed
        closedAt
        merged
        mergedAt
        isDraft
        body author { login } viewerDidAuthor createdAt updatedAt lastEditedAt
        comments(first: 100, after: $commentCursor) {
          pageInfo { hasNextPage endCursor }
          nodes { body url createdAt updatedAt lastEditedAt editor { login } viewerDidAuthor author { login } }
        }
        reviews(first: 100, after: $reviewCursor) {
          pageInfo { hasNextPage endCursor }
          nodes { body url state submittedAt createdAt updatedAt lastEditedAt editor { login } viewerDidAuthor author { login } }
        }
        reviewThreads(first: 100, after: $threadCursor) {
          pageInfo { hasNextPage endCursor }
          nodes {
            isResolved
            isOutdated
            path
            resolvedBy { login }
            comments(first: 100) {
              pageInfo { hasNextPage endCursor }
              # `pullRequestReview.databaseId` is the round this comment was carried in,
              # and is the same integer REST calls `pull_request_review_id` — verified
              # against both APIs on a live PR. Without it the live path loses round
              # grouping entirely while the REST-shaped fixtures keep it, so the tests
              # pass and the tool collapses every finding into one unknown round.
              nodes {
                body url createdAt updatedAt lastEditedAt editor { login }
                viewerDidAuthor author { login }
                pullRequestReview { databaseId }
              }
            }
          }
        }
      }
    }
  }
  rateLimit { cost remaining resetAt }
}
