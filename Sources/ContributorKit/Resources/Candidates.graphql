# Enumeration, source one of three: GitHub's search index.
#
# `commenter:` indexes ISSUE comments, so a PR carrying only inline review
# comments can fall outside this result. `involves:` is documented as an OR over
# author/assignee/mentions/commenter and inherits the same gap. Union this with
# the two repo-wide REST endpoints; see the brief's enumeration section.
#
# The connection is capped at 1,000 results across all types — stated in the
# schema's own doc comment on issueCount, not folklore.
#
# Validated 2026-09-05 against octokit/graphql-schema@main with graphql-js.
query Candidates($q: String!, $cursor: String) {
  search(type: ISSUE, query: $q, first: 100, after: $cursor) {
    issueCount
    pageInfo { hasNextPage endCursor }
    nodes {
      __typename
      ... on Issue { number url updatedAt }
      ... on PullRequest { number url updatedAt }
    }
  }
  rateLimit { cost remaining resetAt }
}
